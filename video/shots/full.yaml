out: out

defaults:
  viewport: { width: 1440, height: 810 }
  scale: 1.3333333
  output: 1920x1080
  fps: 30
  crf: 18
  tail: 200
  zoom: { level: 1.18, max: 1.5, ramp: 0.65, rampOut: 0.75, hold: 0.9, padding: 0.16 }

